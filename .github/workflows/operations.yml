name: ResQ Manual Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance to run
        type: choice
        options: [all, feeds, safety, photos, health]
        default: all

permissions:
  contents: read

concurrency:
  group: resq-manual-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: production
      FIREBASE_PROJECT_ID: resq-106ed
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.RESQ_FIREBASE_SERVICE_ACCOUNT_JSON }}
      CLOUDINARY_URL: ${{ secrets.RESQ_CLOUDINARY_URL }}
      IMD_DISTRICT_IDS: ${{ vars.RESQ_IMD_DISTRICT_IDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install backend
        working-directory: backend
        run: python -m pip install .
      - name: Refresh feeds
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'feeds') }}
        working-directory: backend
        run: python scripts/ingest_alerts.py
      - name: Retry safety delivery
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'safety') }}
        working-directory: backend
        run: python scripts/retry_sos.py
      - name: Send check-in reminders
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'safety') }}
        working-directory: backend
        run: python scripts/send_checkin_reminders.py
      - name: Install ClamAV definitions
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'photos') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Screen private photos
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'photos') }}
        working-directory: backend
        run: python scripts/scan_photos.py
      - name: Purge expired photos
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'photos') }}
        working-directory: backend
        run: python scripts/purge_photos.py
      - name: Purge AI usage counters
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'photos') }}
        working-directory: backend
        run: python scripts/purge_ai_usage.py
      - name: Check maintenance health
        if: ${{ !cancelled() && (inputs.task == 'all' || inputs.task == 'health') }}
        working-directory: backend
        run: python scripts/monitor_health.py
