name: Deploy Tested ResQ Commit

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build ResQ Mobile Releases run ID with tested artifacts
        required: true
      tested_commit:
        description: Full 40-character Git commit SHA from that run
        required: true
      release_tag:
        description: New release tag, for example v1.0.0
        required: true
      android_tested:
        description: Production APK tested on Android device
        required: true
        type: boolean
      iphone_tested:
        description: GitHub-built IPA tested on iPhone
        required: true
        type: boolean
      web_tested:
        description: Production web artifact exercised in browser
        required: true
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: resq-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.android_tested && inputs.iphone_tested && inputs.web_tested
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate tested build identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          TESTED_COMMIT: ${{ inputs.tested_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          run_json=$(gh run view "$BUILD_RUN_ID" --repo "${{ github.repository }}" --json headSha,conclusion,name)
          test "$(jq -r .headSha <<< "$run_json")" = "$TESTED_COMMIT"
          test "$(jq -r .conclusion <<< "$run_json")" = success
          test "$(jq -r .name <<< "$run_json")" = 'Build ResQ Mobile Releases'
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo 'Release tag already exists.' >&2
            exit 1
          fi

      - name: Checkout exactly tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tested_commit }}

      - name: Download exactly tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          mkdir -p release frontend/build/web
          gh run download "$BUILD_RUN_ID" --repo "${{ github.repository }}" -n android-release -D release
          gh run download "$BUILD_RUN_ID" --repo "${{ github.repository }}" -n ios-ipa -D release
          gh run download "$BUILD_RUN_ID" --repo "${{ github.repository }}" -n web-release -D frontend/build/web
          test -f frontend/build/web/main.dart.js
          test "$(find release -maxdepth 1 -name '*.apk' | wc -l)" -ge 1
          test "$(find release -maxdepth 1 -name '*.ipa' | wc -l)" -ge 1
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Deploy tested Firestore rules, indexes, and web artifact
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.RESQ_FIREBASE_SERVICE_ACCOUNT_JSON }}
        working-directory: frontend
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          credential_file="$RUNNER_TEMP/resq-firebase-credential.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          npx --yes firebase-tools@15.30.1 deploy --project resq-106ed --only firestore:rules,firestore:indexes,hosting --non-interactive

      - name: Deploy the same commit to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RESQ_RENDER_DEPLOY_HOOK }}
          TESTED_COMMIT: ${{ inputs.tested_commit }}
          RESQ_API_BASE_URL: ${{ vars.RESQ_API_BASE_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          test -n "$RESQ_API_BASE_URL"
          curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK&ref=$TESTED_COMMIT" >/dev/null
          for attempt in $(seq 1 40); do
            response=$(curl --max-time 30 --silent "$RESQ_API_BASE_URL/v1/health" || true)
            if jq -e --arg sha "$TESTED_COMMIT" '.status == "ok" and .environment == "production" and .commit == $sha' <<< "$response" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          echo 'Render did not report the tested commit.' >&2
          exit 1

      - name: Verify hosted web response
        run: curl --fail --silent --show-error https://resq-106ed.web.app/ >/dev/null

      - name: Publish tested mobile artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TESTED_COMMIT: ${{ inputs.tested_commit }}
        run: |
          gh release create "$RELEASE_TAG" release/* --repo "${{ github.repository }}" \
            --target "$TESTED_COMMIT" --title "ResQ $RELEASE_TAG" --generate-notes
