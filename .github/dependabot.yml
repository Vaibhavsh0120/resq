version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Major package upgrades require an intentional API migration. Dependabot
    # security updates are unaffected by this version-update rule.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
