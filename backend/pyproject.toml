[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resq-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "firebase-admin>=7,<8",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "cloudinary>=1.44,<2",
  "feedparser>=6.0.12,<7",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]
